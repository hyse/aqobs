name: Taiwan Air Quality Scraper

on:
  schedule:
    # 每小时执行两次任务（例如每小时的第 28 分和第 51 分，可根据发布延迟微调）
    - cron: '28,51 * * * *'
  workflow_dispatch: # 允许在 GitHub 页面上手动触发运行

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Execute Scraper Script
      run: python taiwan_scraper.py

    - name: Upload Data Artifact
      uses: actions/upload-artifact@v4
      with:
        name: taiwan-air-quality-data
        path: data_output/
        retention-days: 1 # 暂存 1 天，供本地脚本定时下载
