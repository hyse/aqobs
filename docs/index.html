<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="qbicon.png" sizes="32x32">
    <title>aqobs :: hi-res air quality map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 性能优化：提前进行 DNS 预解析和 TCP/TLS 预连接 -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- 跨域 iframe 安全拦截：防止 MapLibre 因访问父窗口 location.href 报错 -->
    <script>
        try {
            Object.defineProperty(window, 'parent', {
                get: function() { return window; },
                configurable: true
            });
            Object.defineProperty(window, 'top', {
                get: function() { return window; },
                configurable: true
            });
        } catch (e) {
            console.warn("无法重定义 window.parent 或 top:", e);
        }
    </script>

    <!-- 引入 MapLibre GL JS 样式与脚本 -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        /* 极简精致的转圈提示：地图一旦开始渲染就自动淡出，不阻挡用户视线 */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #555;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s ease;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ddd;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <span>正在载入地图...</span>
    </div>
    
    <div id="map"></div>

    <script>
        // 默认备用中心坐标（北京）
        const DEFAULT_LAT = 39.9042;
        const DEFAULT_LON = 116.4074;

        /**
         * 根据当前纬度和屏幕短边像素数，计算出让短边正好对应 40 公里实际物理距离的地图缩放级别 (Zoom Level)
         */
        function calculateZoomFor40Km(lat) {
            const shortEdgePixels = Math.min(window.innerWidth, window.innerHeight);
            const targetMeters = 40000; // 40公里 = 40,000米
            const earthCircumference = 40075016.686; // 墨卡托投影下的赤道周长
            const latRad = lat * Math.PI / 180;
            
            const numerator = shortEdgePixels * earthCircumference * Math.cos(latRad);
            const denominator = 256 * targetMeters;
            let zoom = Math.log2(numerator / denominator);
            
            return Math.max(0, Math.min(22, zoom));
        }

        /**
         * 获取 URL 中的查询参数
         */
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                lat: params.get('lat') ? parseFloat(params.get('lat')) : null,
                lon: params.get('lon') ? parseFloat(params.get('lon')) : null,
                scale: params.get('scale') ? parseFloat(params.get('scale')) : null
            };
        }

        /**
         * 异步获取 IP 定位（带 1.5 秒严格超时控制，防止卡死地图加载）
         */
        async function fetchIpLocation() {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 1500); // 1.5秒超时

            try {
                // 使用 ip-api.com 的 JSON 接口，全球节点分布广且稳定
                const response = await fetch('https://ip-api.com/json/?fields=status,lat,lon', {
                    signal: controller.signal
                });
                clearTimeout(id);
                const data = await response.json();
                if (data && data.status === 'success' && data.lat && data.lon) {
                    return { lat: data.lat, lon: data.lon };
                }
            } catch (e) {
                console.warn('静默定位获取超时或失败，使用默认坐标:', e.message);
            }
            return null;
        }

        /**
         * 初始化地图
         */
        async function init() {
            const params = getQueryParams();
            
            // 是否有有效的 URL 坐标传入
            const hasUrlCoords = (params.lat !== null && !isNaN(params.lat) && params.lon !== null && !isNaN(params.lon));
            
            // 立即决定初始渲染位置（如果有 URL 坐标就用 URL 的，没有就直接用默认北京坐标，一秒都不等！）
            const initialLat = hasUrlCoords ? params.lat : DEFAULT_LAT;
            const initialLon = hasUrlCoords ? params.lon : DEFAULT_LON;
            const initialZoom = (params.scale !== null && !isNaN(params.scale)) 
                ? params.scale 
                : calculateZoomFor40Km(initialLat);

            // 立即创建并渲染地图
            const map = new maplibregl.Map({
                container: 'map',
                style: 'https://tiles.openfreemap.org/styles/liberty', 
                center: [initialLon, initialLat],
                zoom: initialZoom,
                cooperativeGestures: false, // 滚轮直接无限制缩放（类似 Google Earth）
                attributionControl: false
            });

            // 地图一旦开始渲染首帧，立刻淡出并移除 Loader
            map.on('styledata', () => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 200);
                }
            });

            // 实时更新 URL 状态，便于用户复制分享
            function updateURL() {
                const center = map.getCenter();
                const currentZoom = map.getZoom();
                const newUrl = `${window.location.origin}${window.location.pathname}?lat=${center.lat.toFixed(6)}&lon=${center.lng.toFixed(6)}&scale=${currentZoom.toFixed(2)}`;
                window.history.replaceState(null, '', newUrl);
            }

            map.on('moveend', updateURL);
            map.on('zoomend', updateURL);

            // 自适应屏幕短边 40km 逻辑（仅在 URL 未手动指定 scale 时生效）
            if (params.scale === null) {
                window.addEventListener('resize', () => {
                    const center = map.getCenter();
                    const nextZoom = calculateZoomFor40Km(center.lat);
                    map.setZoom(nextZoom);
                });
            }

            // 【核心提速步骤】：在地图已经加载渲染的过程中，在后台默默去查 IP 
            if (!hasUrlCoords) {
                fetchIpLocation().then(loc => {
                    if (loc) {
                        // 查到位置后，如用户未进行手动拖拽干扰，则平滑飞过去
                        map.flyTo({
                            center: [loc.lon, loc.lat],
                            zoom: (params.scale !== null && !isNaN(params.scale)) ? params.scale : calculateZoomFor40Km(loc.lat),
                            essential: true,
                            speed: 1.5
                        });
                    }
                });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
