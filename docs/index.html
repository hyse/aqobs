<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="qbicon.png" sizes="32x32">
    <title>aqobs :: hi-res air quality map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 跨域 iframe 安全拦截：防止 MapLibre 因访问父窗口 location.href 报错 -->
    <script>
        try {
            Object.defineProperty(window, 'parent', {
                get: function() {
                    return window;
                },
                configurable: true
            });
            Object.defineProperty(window, 'top', {
                get: function() {
                    return window;
                },
                configurable: true
            });
        } catch (e) {
            console.warn("无法重定义 window.parent 或 window.top:", e);
        }
    </script>

    <!-- 引入 MapLibre GL JS 样式与脚本 -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f4;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        /* 加载动画：在地图渲染完毕前提供友好的视觉提示 */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #555;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <span>正在载入高精度地图...</span>
    </div>
    
    <div id="map"></div>

    <script>
        // 默认中心坐标 (如果URL未指定且IP定位失效，使用该备用坐标。此处设为西安，即中国地理中心点附近)
        const DEFAULT_LAT = 34.3415;
        const DEFAULT_LON = 108.9404;

        /**
         * 根据当前纬度和屏幕短边像素数，计算出让短边正好对应 40 公里实际物理距离的地图缩放级别 (Zoom Level)
         * @param {number} lat - 纬度
         * @returns {number} 缩放级别
         */
        function calculateZoomFor40Km(lat) {
            const shortEdgePixels = Math.min(window.innerWidth, window.innerHeight);
            const targetMeters = 40000; // 40公里 = 40,000米
            const earthCircumference = 40075016.686; // 墨卡托投影下的赤道周长（米）
            const latRad = lat * Math.PI / 180;
            
            // 墨卡托投影下的缩放计算公式:
            // 2^z = (屏幕短边像素 * 赤道周长 * cos(纬度)) / (256 * 目标物理距离)
            const numerator = shortEdgePixels * earthCircumference * Math.cos(latRad);
            const denominator = 256 * targetMeters;
            let zoom = Math.log2(numerator / denominator);
            
            // 限制缩放级别在 MapLibre 合理范围内
            return Math.max(0, Math.min(22, zoom));
        }

        /**
         * 获取 URL 中的查询参数
         */
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                lat: params.get('lat') ? parseFloat(params.get('lat')) : null,
                lon: params.get('lon') ? parseFloat(params.get('lon')) : null,
                scale: params.get('scale') ? parseFloat(params.get('scale')) : null
            };
        }

        /**
         * 借助无需弹窗授权的 IP 定位 API 获取用户大致位置 (放弃精度以保证用户无感知)
         */
        async function getIpLocation() {
            try {
                // ipapi.co 支持 HTTPS 且对免费客户端友好，不弹出任何权限申请弹窗
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('IP定位接口响应异常');
                const data = await response.json();
                if (data.latitude && data.longitude) {
                    return { lat: data.latitude, lon: data.longitude };
                }
            } catch (e) {
                console.warn('IP定位失败，使用默认地理中心定位。', e);
            }
            return { lat: DEFAULT_LAT, lon: DEFAULT_LON };
        }

        /**
         * 初始化并渲染地图
         */
        async function init() {
            const params = getQueryParams();
            let finalLat, finalLon, finalZoom;

            // 1. 确定经纬度坐标
            if (params.lat !== null && !isNaN(params.lat) && params.lon !== null && !isNaN(params.lon)) {
                finalLat = params.lat;
                finalLon = params.lon;
            } else {
                // 无 URL 坐标则使用 IP 粗略定位，保证不弹出定位授权确认框
                const ipLoc = await getIpLocation();
                finalLat = ipLoc.lat;
                finalLon = ipLoc.lon;
            }

            // 2. 确定缩放级别 (Zoom)
            if (params.scale !== null && !isNaN(params.scale)) {
                // 如果指定了 scale，直接将其作为 zoom 级别使用
                finalZoom = params.scale;
            } else {
                // 如果未指定 scale，计算使屏幕短边对应 40km 的精确 zoom
                finalZoom = calculateZoomFor40Km(finalLat);
            }

            // 3. 构建 MapLibre 地图实例
            const map = new maplibregl.Map({
                container: 'map',
                // 使用 OpenFreeMap 官方 Liberty 样式
                style: 'https://tiles.openfreemap.org/styles/liberty', 
                center: [finalLon, finalLat],
                zoom: finalZoom,
                // cooperativeGestures 设为 false，滚轮直接触发缩放 (类似 Google Earth)，无需按住 Ctrl 键
                cooperativeGestures: false, 
                attributionControl: false // 保持极简页面，不渲染多余控件
            });

            // 4. 地图加载完成后，隐藏加载动画提示
            map.on('load', () => {
                const loader = document.getElementById('loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
            });

            // 5. 绑定拖动和缩放事件，实时更新 URL，便于分享
            function updateURL() {
                const center = map.getCenter();
                const currentZoom = map.getZoom();
                const newUrl = `${window.location.origin}${window.location.pathname}?lat=${center.lat.toFixed(6)}&lon=${center.lng.toFixed(6)}&scale=${currentZoom.toFixed(2)}`;
                window.history.replaceState(null, '', newUrl);
            }

            map.on('moveend', updateURL);
            map.on('zoomend', updateURL);

            // 当窗口大小改变时，如果最初 URL 没填 scale，则自适应调整缩放以保持屏幕短边为 40km
            if (params.scale === null) {
                window.addEventListener('resize', () => {
                    const center = map.getCenter();
                    const nextZoom = calculateZoomFor40Km(center.lat);
                    map.setZoom(nextZoom);
                });
            }
        }

        // 启动流程
        window.onload = init;
    </script>
</body>
</html>
